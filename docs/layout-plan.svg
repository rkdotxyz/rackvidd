<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="40" y="38" font-size="18" font-weight="600" fill="#1f1f1f">Floor plan (top-down)</text>
  <text x="40" y="60" font-size="13" fill="#6b6b6b">Scale ≈ 1 m = 120 px · all sizes approximate</text>

  <!-- footprint -->
  <rect x="240" y="100" width="420" height="550" fill="#fafaf8" stroke="#b9b9b6" stroke-dasharray="6 5"/>
  <text x="450" y="672" font-size="12" fill="#8a8a87" text-anchor="middle">Footprint ≈ 3.5 m wide × 4.5 m deep</text>

  <!-- wall -->
  <line x1="200" y1="100" x2="700" y2="100" stroke="#3a3a3a" stroke-width="6"/>
  <text x="208" y="90" font-size="12" fill="#3a3a3a">Wall or projection screen</text>

  <!-- beam -->
  <polygon points="450,462 300,104 600,104" fill="#3a7bd5" fill-opacity="0.08" stroke="#3a7bd5" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <!-- projection -->
  <rect x="300" y="100" width="300" height="10" fill="#3a7bd5"/>
  <text x="450" y="132" font-size="13" fill="#2b5ea6" text-anchor="middle">Projected image ≈ 2.5 m wide</text>
  <text x="450" y="149" font-size="12" fill="#2b5ea6" text-anchor="middle">(only the ink sheet, no map, no text)</text>

  <!-- throw dimension -->
  <line x1="270" y1="104" x2="270" y2="458" stroke="#8a8a87"/>
  <line x1="262" y1="104" x2="278" y2="104" stroke="#8a8a87"/>
  <line x1="262" y1="458" x2="278" y2="458" stroke="#8a8a87"/>
  <text x="262" y="285" font-size="12" fill="#6b6b6b" text-anchor="end">≈ 3 m</text>
  <text x="262" y="301" font-size="12" fill="#6b6b6b" text-anchor="end">throw</text>

  <!-- table -->
  <rect x="378" y="452" width="144" height="96" rx="3" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="530" y="545" font-size="12" fill="#6b6b6b">Table 120 × 80 cm</text>
  <!-- projector -->
  <rect x="435" y="456" width="30" height="20" rx="3" fill="#3a3a3a"/>
  <circle cx="450" cy="458" r="4" fill="#3a7bd5"/>
  <!-- A3 map -->
  <rect x="425" y="494" width="50" height="36" fill="#eeeeec" stroke="#6b6b6b"/>
  <rect x="425" y="494" width="5" height="5" fill="#1f1f1f"/><rect x="470" y="494" width="5" height="5" fill="#1f1f1f"/>
  <rect x="425" y="525" width="5" height="5" fill="#1f1f1f"/><rect x="470" y="525" width="5" height="5" fill="#1f1f1f"/>
  <circle cx="444" cy="514" r="4.5" fill="#d6455d"/>
  <!-- camera footprint + arm -->
  <rect x="417" y="487" width="66" height="50" fill="none" stroke="#2f9e6a" stroke-dasharray="3 3"/>
  <line x1="384" y1="458" x2="450" y2="512" stroke="#2f9e6a" stroke-width="2"/>
  <circle cx="384" cy="458" r="4" fill="#2f9e6a"/>
  <rect x="444" y="506" width="12" height="12" rx="2" fill="#2f9e6a"/>
  <!-- laptop -->
  <rect x="486" y="508" width="30" height="22" rx="2" fill="#d9d9d6" stroke="#6b6b6b"/>

  <!-- visitors -->
  <circle cx="420" cy="586" r="16" fill="#eeeeec" stroke="#6b6b6b"/>
  <circle cx="480" cy="586" r="16" fill="#eeeeec" stroke="#6b6b6b"/>
  <path d="M412 574 L420 566 L428 574" fill="none" stroke="#6b6b6b"/>
  <path d="M472 574 L480 566 L488 574" fill="none" stroke="#6b6b6b"/>
  <text x="450" y="626" font-size="12" fill="#6b6b6b" text-anchor="middle">Visitors stand here, facing the wall</text>

  <!-- callout markers -->
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="420" cy="446" r="9" fill="#1f1f1f"/><text x="420" y="450">1</text>
    <circle cx="410" cy="527" r="9" fill="#1f1f1f"/><text x="410" y="531">2</text>
    <circle cx="372" cy="470" r="9" fill="#1f1f1f"/><text x="372" y="474">3</text>
    <circle cx="530" cy="505" r="9" fill="#1f1f1f"/><text x="530" y="509">4</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#1f1f1f">
    <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      <circle cx="712" cy="214" r="9" fill="#1f1f1f"/><text x="712" y="218">1</text>
      <circle cx="712" cy="294" r="9" fill="#1f1f1f"/><text x="712" y="298">2</text>
      <circle cx="712" cy="374" r="9" fill="#1f1f1f"/><text x="712" y="378">3</text>
      <circle cx="712" cy="454" r="9" fill="#1f1f1f"/><text x="712" y="458">4</text>
    </g>
    <text x="730" y="218" font-weight="600">Projector</text>
    <text x="730" y="236" fill="#6b6b6b" font-size="12">On a small riser at the back</text>
    <text x="730" y="252" fill="#6b6b6b" font-size="12">edge, pointing at the wall.</text>
    <text x="730" y="298" font-weight="600">A3 map + token</text>
    <text x="730" y="316" fill="#6b6b6b" font-size="12">Corner markers let the camera</text>
    <text x="730" y="332" fill="#6b6b6b" font-size="12">find the map. Red = token.</text>
    <text x="730" y="378" font-weight="600">Webcam</text>
    <text x="730" y="396" fill="#6b6b6b" font-size="12">On a clamp arm, ≈ 50 cm</text>
    <text x="730" y="412" fill="#6b6b6b" font-size="12">above the map, looking down.</text>
    <text x="730" y="458" font-weight="600">Laptop</text>
    <text x="730" y="476" fill="#6b6b6b" font-size="12">Runs everything offline;</text>
    <text x="730" y="492" fill="#6b6b6b" font-size="12">HDMI to the projector.</text>
    <text x="712" y="540" font-weight="600">Power</text>
    <text x="712" y="558" fill="#6b6b6b" font-size="12">One extension cord to the table;</text>
    <text x="712" y="574" fill="#6b6b6b" font-size="12">cables taped down.</text>
  </g>
</svg>
